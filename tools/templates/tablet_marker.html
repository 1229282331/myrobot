<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>平板标定图 · ID17</title>
  <style>
    * { box-sizing: border-box; }
    html,body { margin:0; width:100%; height:100%; background:white; color:#17212b; }
    body { font:16px system-ui,sans-serif; display:flex; flex-direction:column; }
    header { padding:16px 20px 8px; text-align:center; }
    h1 { margin:0 0 8px; font-size:22px; }
    p { margin:8px 0; line-height:1.5; }
    .controls { display:flex; align-items:center; justify-content:center; gap:12px; flex-wrap:wrap; }
    input { width:min(45vw,320px); }
    button { font:inherit; border:1px solid #8595a5; padding:9px 16px; border-radius:6px; background:white; }
    .stage { flex:1; min-height:0; display:flex; align-items:center; justify-content:center; padding:16px; }
    #target { flex-shrink:0; }
    #target svg { display:block; width:100%; height:100%; }
    footer { padding:8px 20px 16px; text-align:center; font-size:14px; }
    #displayNote { display:none; }
    body.locked header { display:none; }
    body.locked #setupNote { display:none; }
    body.locked #displayNote { display:block; }
    #warning { display:none; margin:24px; text-align:center; font-weight:600; }
    body.invalid #target { visibility:hidden; }
    body.invalid #warning { display:block; position:absolute; }
  </style>
</head>
<body>
  <header>
    <h1>平板标定图</h1>
    <p>调整黑色外框到约 100 mm；实际尺寸以尺子测量为准。</p>
    <div class="controls">
      <label for="size">图案大小</label>
      <input id="size" type="range" min="80" max="600" value="300">
      <button id="lock" type="button">进入展示并固定大小</button>
    </div>
  </header>
  <main class="stage" id="stage">
    <div id="target"><!-- TARGET_SVG --></div>
    <p id="warning">显示区域已改变。请退出展示，重新调整并量尺寸。</p>
  </main>
  <footer>
    <p id="setupNote">显示模式下再量黑框宽、高。采集时固定平板，不旋转、不缩放；保留四周完整白边。</p>
    <div id="displayNote">
      <p>请量黑框实际宽 × 高（mm）。平板和图案在采集期间保持不动。</p>
      <button id="unlock" type="button">退出展示</button>
    </div>
  </footer>
  <script>
    const target=document.getElementById('target'), stage=document.getElementById('stage');
    const size=document.getElementById('size');
    let locked=false;
    function setEdge(edge) {
      // The white quiet zone is included in the outer 8/6 ratio.
      target.style.width=(Number(edge)*8/6)+'px';
      target.style.height=(Number(edge)*8/6)+'px';
    }
    function updateLayout() {
      if(locked) {
        const rect=target.getBoundingClientRect();
        const zoomed=window.visualViewport && Math.abs(window.visualViewport.scale-1)>0.01;
        document.body.classList.toggle('invalid',zoomed || rect.width>stage.clientWidth-32 || rect.height>stage.clientHeight-32);
        return;
      }
      const maxEdge=Math.floor(Math.min(stage.clientWidth-32,stage.clientHeight-32)*6/8);
      size.max=Math.max(80,maxEdge);
      size.value=Math.min(Number(size.value),Number(size.max));
      setEdge(size.value);
    }
    size.addEventListener('input',()=>setEdge(size.value));
    document.getElementById('lock').addEventListener('click',()=>{
      locked=true;
      document.body.classList.add('locked');
      updateLayout();
    });
    document.getElementById('unlock').addEventListener('click',()=>{
      locked=false;
      document.body.classList.remove('locked','invalid');
      updateLayout();
    });
    window.addEventListener('resize',updateLayout);
    if(window.visualViewport) window.visualViewport.addEventListener('resize',updateLayout);
    updateLayout();
  </script>
</body>
</html>
